name: Deploy Auth Service

on:
    push:
        branches:
            - main
        paths:
            - "Services/auth-service/**"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Auth Image
              uses: docker/build-push-action@v4
              with:
                  context: ./Services/auth-service
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/rovex-auth-service:latest

            - name: Deploy Auth to EC2
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /home/ubuntu/rovex-deployment/production
                      docker compose pull auth-service
                      docker compose up -d --no-deps --build auth-service

                      