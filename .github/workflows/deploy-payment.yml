name: Deploy Payment Service

on:
    push:
        branches:
            - main
        paths:
            - "Services/payment-service/**"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Payment Image
              uses: docker/build-push-action@v6
              with:
                  context: ./Services/payment-service
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/rovex-payment-service:latest
                  cache-from: type=gha,scope=payment-service
                  cache-to: type=gha,mode=max,scope=payment-service

            - name: Deploy Payment to EC2
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /home/ubuntu/rovex-deployment/production
                      docker compose pull payment-service
                      docker compose up -d --no-deps --build payment-service
