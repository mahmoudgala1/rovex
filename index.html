<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVEX 3D Rover | Real-time Control</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2300D4D4'/><stop offset='100%25' style='stop-color:%2300B8B8'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><g fill='%230A1929'><rect x='25' y='35' width='35' height='20' rx='3'/><rect x='60' y='40' width='15' height='15' rx='2'/><circle cx='35' cy='60' r='6'/><circle cx='35' cy='60' r='3' fill='%2300D4D4'/><circle cx='62' cy='60' r='6'/><circle cx='62' cy='60' r='3' fill='%2300D4D4'/></g></svg>">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A1929 0%, #132F4C 100%);
            overflow: hidden;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #00D4D4, #00B8B8);
            color: #0A1929;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 212, 212, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
        }
        
        .back-button:hover {
            transform: translateX(-5px);
        }

        .status-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(19, 47, 76, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 212, 212, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 320px;
        }

        .status-panel h3 {
            color: #00D4D4;
            font-size: 0.95rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .status-item {
            background: rgba(0, 212, 212, 0.1);
            border: 1px solid rgba(0, 212, 212, 0.3);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.75rem;
            text-align: center;
        }

        .status-label {
            color: #8a9ba8;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .status-value {
            color: #00D4D4;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .status-value.healthy {
            color: #00E676;
        }

        .status-value.warning {
            color: #FFB74D;
        }

        .status-value.error {
            color: #FF5252;
        }

        .connection-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(19, 47, 76, 0.95);
            border: 2px solid rgba(0, 212, 212, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            z-index: 1000;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00E676;
            box-shadow: 0 0 10px #00E676;
            animation: pulse 2s ease-in-out infinite;
        }

        .connection-dot.disconnected {
            background: #FF5252;
            box-shadow: 0 0 10px #FF5252;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .connection-text {
            color: #00D4D4;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 212, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back
    </a>

    <div class="connection-indicator">
        <div class="connection-dot" id="connectionDot"></div>
        <span class="connection-text" id="connectionStatus">Connecting...</span>
    </div>

    <!-- Real-time Status Panel -->
    <div class="status-panel">
        <h3><i class="fas fa-heartbeat"></i> Live Status</h3>
        
        <div class="status-grid">
            <div class="status-item">
                <div class="status-label">Battery</div>
                <div class="status-value" id="battery">100%</div>
            </div>
            <div class="status-item">
                <div class="status-label">Temperature</div>
                <div class="status-value" id="temperature">25°C</div>
            </div>
            <div class="status-item">
                <div class="status-label">Motor Status</div>
                <div class="status-value" id="motorStatus">OK</div>
            </div>
            <div class="status-item">
                <div class="status-label">Payload</div>
                <div class="status-value" id="payload">Loaded</div>
            </div>
            <div class="status-item">
                <div class="status-label">GPS Lock</div>
                <div class="status-value" id="gpsLock">Locked</div>
            </div>
            <div class="status-item">
                <div class="status-label">Signal</div>
                <div class="status-value" id="signal">Strong</div>
            </div>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // ===== WebSocket Connection =====
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        // Parts registry with status
        const partsRegistry = {};

        function connectWebSocket() {
            try {
                // Replace with your actual WebSocket URL
                ws = new WebSocket('ws://localhost:8080/rover');

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    updateConnectionStatus(true);
                    reconnectAttempts = 0;
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleRoverUpdate(data);
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus(false);
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    updateConnectionStatus(false);
                    attemptReconnect();
                };
            } catch (e) {
                console.error('Error connecting to WebSocket:', e);
                updateConnectionStatus(false);
                attemptReconnect();
            }
        }

        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 30000);
                console.log(`Reconnecting in ${delay}ms...`);
                setTimeout(connectWebSocket, delay);
            }
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const status = document.getElementById('connectionStatus');
            
            if (connected) {
                dot.classList.remove('disconnected');
                status.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                status.textContent = 'Disconnected';
            }
        }

        // Handle incoming rover data from WebSocket
        function handleRoverUpdate(data) {
            // Update battery
            if (data.battery !== undefined) {
                updateStatusUI('battery', data.battery + '%', getHealthClass(data.battery, 20, 50));
            }

            // Update temperature
            if (data.temperature !== undefined) {
                updateStatusUI('temperature', data.temperature + '°C', getHealthClass(100 - Math.abs(data.temperature - 25), 80, 60));
            }

            // Update motor status
            if (data.motorStatus !== undefined) {
                updateStatusUI('motorStatus', data.motorStatus, data.motorStatus === 'OK' ? 'healthy' : 'error');
            }

            // Update payload
            if (data.payload !== undefined) {
                updateStatusUI('payload', data.payload, 'healthy');
            }

            // Update GPS lock
            if (data.gpsLock !== undefined) {
                updateStatusUI('gpsLock', data.gpsLock ? 'Locked' : 'Searching', data.gpsLock ? 'healthy' : 'warning');
            }

            // Update signal
            if (data.signal !== undefined) {
                const signalText = data.signal > 75 ? 'Strong' : data.signal > 50 ? 'Good' : data.signal > 25 ? 'Weak' : 'Lost';
                const signalClass = data.signal > 75 ? 'healthy' : data.signal > 50 ? 'warning' : 'error';
                updateStatusUI('signal', signalText, signalClass);
            }

            // Update part colors based on status
            if (data.parts) {
                updatePartStatus(data.parts);
            }

            // Update cargo opening
            if (data.cargoOpening !== undefined) {
                state.opening = data.cargoOpening / 100;
                document.getElementById('openingSlider').value = data.cargoOpening;
                document.getElementById('openingValue').textContent = data.cargoOpening + '%';
                applyMechanism();
            }

            // Update mechanism if specified
            if (data.mechanism !== undefined) {
                state.mechanism = data.mechanism;
            }
        }

        function updateStatusUI(elementId, value, healthClass) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = value;
                element.className = 'status-value ' + (healthClass || '');
            }
        }

        function getHealthClass(value, warningThreshold, errorThreshold) {
            if (value >= warningThreshold) return 'healthy';
            if (value >= errorThreshold) return 'warning';
            return 'error';
        }

        function updatePartStatus(parts) {
            // This updates visual parts based on status
            // Example: parts = { "wheelFL": { "status": "ok", "temp": 45 }, ... }
            Object.keys(parts).forEach(partName => {
                const partData = parts[partName];
                const part = partsRegistry[partName];
                
                if (part && partData.status) {
                    if (partData.status === 'error') {
                        part.mesh.material.color.setHex(0xFF5252);
                        part.mesh.material.emissiveIntensity = 0.5;
                    } else if (partData.status === 'warning') {
                        part.mesh.material.color.setHex(0xFFB74D);
                    } else {
                        part.mesh.material.color.setHex(part.color);
                        part.mesh.material.emissiveIntensity = part.emissiveIntensity || 0;
                    }
                }
            });
        }

        // ===== 3D Scene =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2332);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 3, 0);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(20, 30, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4a90e2, 0.4);
        fillLight.position.set(-15, 10, -15);
        scene.add(fillLight);

        // Ground
        const groundGeometry = new THREE.CircleGeometry(50, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a3a4a,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(50, 50, 0x00D4D4, 0x3a4a5a);
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // Texture Loader
        const textureLoader = new THREE.TextureLoader();

        // Create Rover
        const rover = new THREE.Group();
        const SCALE = 1.5;

        function registerPart(name, mesh, type, initialColor) {
            partsRegistry[name] = {
                mesh: mesh,
                type: type,
                color: initialColor,
                scale: mesh.scale.clone(),
                visible: true,
                opacity: 1,
                emissiveIntensity: 0
            };
        }

        // Main body
        const bodyGeometry = new RoundedBoxGeometry(3.5 * SCALE, 2.5 * SCALE, 4 * SCALE, 8, 0.3 * SCALE);
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0xf8f8f8,
            metalness: 0.2,
            roughness: 0.4
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 2 * SCALE;
        body.castShadow = true;
        body.name = 'body';
        rover.add(body);
        registerPart('body', body, 'Main Structure', 0xf8f8f8);

        // Cyan band
        const bandGeometry = new THREE.BoxGeometry(3.7 * SCALE, 0.5 * SCALE, 4.2 * SCALE);
        const bandMaterial = new THREE.MeshStandardMaterial({
            color: 0x00D4D4,
            emissive: 0x00D4D4,
            emissiveIntensity: 0.3,
            metalness: 0.8,
            roughness: 0.2
        });
        const band = new THREE.Mesh(bandGeometry, bandMaterial);
        band.position.y = 2 * SCALE;
        band.castShadow = true;
        band.name = 'band';
        rover.add(band);
        registerPart('band', band, 'Accent Band', 0x00D4D4);

        // Logo
        const logoTexture = textureLoader.load(
            'https://res.cloudinary.com/dty7q0xhs/image/upload/v1764447802/finallogo_dwmshm.png',
            undefined,
            undefined,
            function(error) {
                console.error('Error loading logo:', error);
            }
        );

        const logoGeometry = new THREE.PlaneGeometry(2 * SCALE, 1 * SCALE);
        const logoMaterial = new THREE.MeshStandardMaterial({
            map: logoTexture,
            transparent: true,
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.1
        });

        const logoLeft = new THREE.Mesh(logoGeometry, logoMaterial);
        logoLeft.position.set(-1.86 * SCALE, 2.5 * SCALE, 0);
        logoLeft.rotation.y = Math.PI / 2;
        logoLeft.name = 'logoLeft';
        rover.add(logoLeft);
        registerPart('logoLeft', logoLeft, 'Logo', 0xffffff);

        const logoRight = new THREE.Mesh(logoGeometry, logoMaterial.clone());
        logoRight.position.set(1.86 * SCALE, 2.5 * SCALE, 0);
        logoRight.rotation.y = -Math.PI / 2;
        logoRight.name = 'logoRight';
        rover.add(logoRight);
        registerPart('logoRight', logoRight, 'Logo', 0xffffff);

        // Bottom base
        const baseGeometry = new RoundedBoxGeometry(3.8 * SCALE, 0.5 * SCALE, 4.3 * SCALE, 8, 0.2 * SCALE);
        const baseMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a2a,
            metalness: 0.7,
            roughness: 0.3
        });
        const base = new THREE.Mesh(baseGeometry, baseMaterial);
        base.position.y = 0.6 * SCALE;
        base.castShadow = true;
        base.name = 'base';
        rover.add(base);
        registerPart('base', base, 'Base Platform', 0x2a2a2a);

        // Cargo lid
        const cargoLid = new THREE.Group();
        cargoLid.name = 'cargoLid';
        
        const lidGeometry = new RoundedBoxGeometry(3.2 * SCALE, 0.4 * SCALE, 3.5 * SCALE, 8, 0.15 * SCALE);
        const lidMaterial = new THREE.MeshStandardMaterial({
            color: 0x00D4D4,
            metalness: 0.6,
            roughness: 0.3
        });
        const lid = new THREE.Mesh(lidGeometry, lidMaterial);
        lid.castShadow = true;
        cargoLid.add(lid);
        cargoLid.position.set(0, 5.2 * SCALE, -1.4 * SCALE);
        rover.add(cargoLid);
        registerPart('cargoLid', cargoLid, 'Cargo Door', 0x00D4D4);

        // Package
        const packageGroup = new THREE.Group();
        packageGroup.name = 'package';
        
        const packageGeometry = new THREE.BoxGeometry(1.8 * SCALE, 1.2 * SCALE, 1.8 * SCALE);
        const packageMaterial = new THREE.MeshStandardMaterial({
            color: 0x8B4513,
            roughness: 0.8
        });
        const packageMesh = new THREE.Mesh(packageGeometry, packageMaterial);
        packageMesh.castShadow = true;
        packageGroup.add(packageMesh);
        packageGroup.position.set(0, 3.8 * SCALE, 0);
        rover.add(packageGroup);
        registerPart('package', packageGroup, 'Payload', 0x8B4513);

        // Wheels
        function createWheel() {
            const wheelGroup = new THREE.Group();
            
            const tireGeometry = new THREE.CylinderGeometry(0.5 * SCALE, 0.5 * SCALE, 0.4 * SCALE, 32);
            const tireMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.95
            });
            const tire = new THREE.Mesh(tireGeometry, tireMaterial);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            wheelGroup.add(tire);
            
            const capGeometry = new THREE.CylinderGeometry(0.15 * SCALE, 0.15 * SCALE, 0.45 * SCALE, 20);
            const capMaterial = new THREE.MeshStandardMaterial({
                color: 0x00D4D4,
                emissive: 0x00D4D4,
                emissiveIntensity: 0.3,
                metalness: 0.9
            });
            const cap = new THREE.Mesh(capGeometry, capMaterial);
            cap.rotation.z = Math.PI / 2;
            wheelGroup.add(cap);
            
            return wheelGroup;
        }

        const wheelY = 0.5 * SCALE;
        const wheelOffsetX = 2.1 * SCALE;
        
        const wheelFL = createWheel();
        wheelFL.position.set(-wheelOffsetX, wheelY, 1.5 * SCALE);
        wheelFL.name = 'wheelFL';
        rover.add(wheelFL);
        registerPart('wheelFL', wheelFL, 'Wheel', 0x1a1a1a);

        const wheelFR = createWheel();
        wheelFR.position.set(wheelOffsetX, wheelY, 1.5 * SCALE);
        wheelFR.name = 'wheelFR';
        rover.add(wheelFR);
        registerPart('wheelFR', wheelFR, 'Wheel', 0x1a1a1a);

        const wheelBL = createWheel();
        wheelBL.position.set(-wheelOffsetX, wheelY, -1.5 * SCALE);
        wheelBL.name = 'wheelBL';
        rover.add(wheelBL);
        registerPart('wheelBL', wheelBL, 'Wheel', 0x1a1a1a);

        const wheelBR = createWheel();
        wheelBR.position.set(wheelOffsetX, wheelY, -1.5 * SCALE);
        wheelBR.name = 'wheelBR';
        rover.add(wheelBR);
        registerPart('wheelBR', wheelBR, 'Wheel', 0x1a1a1a);

        // LED lights
        const ledGeometry = new THREE.SphereGeometry(0.1 * SCALE, 16, 16);
        const ledMaterial = new THREE.MeshStandardMaterial({
            color: 0x00E676,
            emissive: 0x00E676,
            emissiveIntensity: 2
        });
        
        const led1 = new THREE.Mesh(ledGeometry, ledMaterial);
        led1.position.set(-1.5 * SCALE, 2.6 * SCALE, 2.1 * SCALE);
        led1.name = 'led1';
        rover.add(led1);
        registerPart('led1', led1, 'LED', 0x00E676);
        
        const led2 = new THREE.Mesh(ledGeometry, ledMaterial.clone());
        led2.position.set(1.5 * SCALE, 2.6 * SCALE, 2.1 * SCALE);
        led2.name = 'led2';
        rover.add(led2);
        registerPart('led2', led2, 'LED', 0x00E676);

        // Camera
        const cameraGeometry = new THREE.BoxGeometry(0.5 * SCALE, 0.4 * SCALE, 0.3 * SCALE);
        const cameraMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            metalness: 0.9
        });
        const frontCamera = new THREE.Mesh(cameraGeometry, cameraMaterial);
        frontCamera.position.set(0, 2.8 * SCALE, 2.2 * SCALE);
        frontCamera.castShadow = true;
        frontCamera.name = 'camera';
        rover.add(frontCamera);
        registerPart('camera', frontCamera, 'Camera', 0x1a1a1a);

        scene.add(rover);

        // State
        const state = {
            mechanism: 'hinge',
            opening: 0,
            animating: false
        };

        function applyMechanism() {
            const progress = state.opening;
            
            switch(state.mechanism) {
                case 'hinge':
                    cargoLid.rotation.x = -progress * Math.PI * 0.6;
                    break;
                    
                case 'slide':
                    cargoLid.position.z = -1.4 * SCALE - progress * 3 * SCALE;
                    break;
                    
                case 'lift':
                    cargoLid.position.y = 5.2 * SCALE + progress * 3 * SCALE;
                    break;
                    
                case 'roll':
                    cargoLid.rotation.x = -progress * Math.PI * 2;
                    cargoLid.position.y = 5.2 * SCALE + progress * 1.5 * SCALE;
                    cargoLid.position.z = -1.4 * SCALE - progress * 1.5 * SCALE;
                    break;
            }
        }

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Pulse LEDs
            led1.material.emissiveIntensity = 2 + Math.sin(elapsedTime * 3) * 0.5;
            led2.material.emissiveIntensity = 2 + Math.sin(elapsedTime * 3 + Math.PI) * 0.5;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize WebSocket connection
        connectWebSocket();
    </script>
</body>
</html>
