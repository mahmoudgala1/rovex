syntax = "proto3";

package telemetry;

service TelemetryService {
  // Returns idle rovers for a given company
  rpc GetIdleRovers(GetIdleRoversRequest) returns (GetIdleRoversResponse);

  // Assigns a order to a rover
  rpc AssignOrder(AssignOrderRequest) returns (AssignOrderResponse);
}

// ─── GetIdleRovers ────────────────────────────────────────────

message GetIdleRoversRequest {
  string company_id = 1;
}

message GetIdleRoversResponse {
  bool success              = 1;
  repeated IdleRover rovers = 2;
  int32  total_count        = 3;  // total idle rovers for the company
}

message Position {
  double latitude  = 1;
  double longitude = 2;
}

message IdleRover {
  string   rover_id            = 1;
  Position base_position       = 2;
  float battery_level          = 3;
}

// ─── AssignOrder ───────────────────────────────────────────────

message AssignOrderRequest {
  string order_id               = 1;
  string rover_id               = 2;
  Position destination_position = 3;
}

message AssignOrderResponse {
  bool   success           = 1;
  string assigned_order_id = 2;
  string message           = 3;
}