syntax = "proto3";


service AuthService {
  rpc VerifyToken (VerifyTokenRequest) returns (UserResponse);
}

// The Input
message VerifyTokenRequest {
  string token = 1; // unique tag
}

// The Output
message UserResponse {
  bool isValid = 1;
  string userId = 2;
  string email = 3;
  string role = 4;
  string error = 5; // Optional error message
}