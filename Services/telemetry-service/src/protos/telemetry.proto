syntax = "proto3";

package telemetry;

service TelemetryService {
  // Returns idle rovers for a given company
  rpc GetIdleRovers(GetIdleRoversRequest) returns (GetIdleRoversResponse);

  // Assigns a order to a rover
  rpc AssignOrder(AssignOrderRequest) returns (AssignOrderResponse);
}

// ─── GetIdleRovers ────────────────────────────────────────────

message GetIdleRoversRequest {
  string company_id = 1;
}

message GetIdleRoversResponse {
  repeated IdleRover rovers = 1;
  int32  total_count        = 2;  // total idle rovers for the company
}

message Position {
  double latitude  = 1;
  double longitude = 2;
  string address   = 3;  // optional human-readable address
}

message IdleRover {
  string   rover_id        = 1;
  string   company_id      = 2;
  string   last_seen_at    = 3;  // ISO 8601 timestamp
  Position current_position    = 4;  // where the rover is right now
  Position destination_position = 5; // where it needs to go
}

// ─── AssignOrder ───────────────────────────────────────────────

message AssignOrderkRequest {
  string order_id   = 1;
  string rover_id   = 2;
  string company_id = 3;
}

message AssignOrderResponse {
  bool   success = 1;
}