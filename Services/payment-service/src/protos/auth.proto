syntax = "proto3";

package auth;

service AuthService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}


message GetUserRequest {
  string user_id = 1;
  string user_type = 2;
}

message GetUserResponse {
  bool success = 1;
  User user = 2;
  string error = 3;
}

message User {
  string customer_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
}
