<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .content { padding: 30px; background: #f9f9f9; }
        .otp-box { background: white; padding: 20px; text-align: center; border: 2px dashed #667eea; border-radius: 8px; margin: 20px 0; }
        .otp-code { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #667eea; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ROVEX</h1>
            <p>Verify Your Email</p>
        </div>
        <div class="content">
            <p>Hi {{name}},</p>
            <p>Welcome to ROVEX! Use the following OTP code to verify your email address:</p>
            
            <div class="otp-box">
                <div class="otp-code">{{otp}}</div>
            </div>
            
            <p><strong>This code expires in {{expires_in}}</strong></p>
            <p>If you didn't request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>© 2025 ROVEX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
